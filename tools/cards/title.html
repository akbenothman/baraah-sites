<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>title card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1280px;height:720px;background:#0E0E10;color:#EAE7E0;
    font-family:'Inter','Helvetica Neue',system-ui,sans-serif;font-weight:300;
    display:flex;flex-direction:column;justify-content:center;padding:0 6rem;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  .mark{display:flex;align-items:center;gap:.7rem;font-size:1.25rem;letter-spacing:-.02em;
    opacity:0;animation:in .9s cubic-bezier(.22,.61,.36,1) .15s forwards}
  .mark i{width:16px;height:16px;border-radius:50%;background:#D8CFC0}
  h1{font-size:4.6rem;line-height:1.02;letter-spacing:-.045em;font-weight:300;
    margin:2.2rem 0 1.6rem;opacity:0;
    animation:in 1s cubic-bezier(.22,.61,.36,1) .45s forwards}
  h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;
    color:#D8CFC0;letter-spacing:-.02em}
  p{font-size:1.2rem;color:#8E8B84;max-width:46ch;opacity:0;
    animation:in 1s cubic-bezier(.22,.61,.36,1) .8s forwards}
  .rule{height:1px;background:rgba(234,231,224,.14);margin:3rem 0 1.6rem;transform:scaleX(0);
    transform-origin:left;animation:wipe 1.1s cubic-bezier(.22,.61,.36,1) 1.05s forwards}
  ul{display:flex;gap:3.5rem;list-style:none;padding:0;font-size:.78rem;letter-spacing:.18em;
    text-transform:uppercase;color:#8E8B84;opacity:0;
    animation:in .9s cubic-bezier(.22,.61,.36,1) 1.3s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @keyframes wipe{to{transform:scaleX(1)}}
  .mark,h1,p,ul{transform:translateY(20px)}
</style>
</head>
<body>
  <div class="mark"><i></i> baraah-sites</div>
  <h1>Custom websites,<br><em>hand-built</em>.</h1>
  <p>Five real builds — a coffee roaster, a nail studio, a skincare label,
     a movement studio and a restaurant.</p>
  <div class="rule"></div>
  <ul>
    <li>No templates</li>
    <li>No page builders</li>
    <li>Loads in under a second</li>
  </ul>
</body>
</html>
