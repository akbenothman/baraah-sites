<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>end card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Sized in vw so the card fills whatever frame the recorder is set to. */
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:#0E0E10;color:#EAE7E0;
    font-family:'Inter','Helvetica Neue',system-ui,sans-serif;font-weight:300;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:0 6vw;-webkit-font-smoothing:antialiased}
  h2{font-size:4.25vw;line-height:1.06;letter-spacing:-.045em;font-weight:300;
    opacity:0;transform:translateY(1.5vw);
    animation:in 1s cubic-bezier(.22,.61,.36,1) .1s forwards}
  h2 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;
    color:#D8CFC0}
  .tiers{display:flex;gap:1.25vw;margin:3.25vw 0 3vw}
  .tier{padding:1.4vw 2.5vw;border-radius:.95vw;background:#151518;
    box-shadow:inset 0 0 0 1px rgba(234,231,224,.13);opacity:0;transform:translateY(1.5vw);
    animation:in .8s cubic-bezier(.22,.61,.36,1) forwards}
  .tier:nth-child(1){animation-delay:.5s}
  .tier:nth-child(2){animation-delay:.62s;box-shadow:inset 0 0 0 1px rgba(216,207,192,.34)}
  .tier:nth-child(3){animation-delay:.74s}
  .tier b{display:block;font-size:.85vw;letter-spacing:.2em;text-transform:uppercase;
    color:#8E8B84;font-weight:400}
  .tier span{display:block;font-size:2.4vw;letter-spacing:-.04em;margin-top:.45vw;
    color:#D8CFC0}
  .tier i{display:block;font-style:normal;font-size:.93vw;color:#8E8B84;margin-top:.4vw}
  .mark{display:flex;align-items:center;gap:.85vw;font-size:1.9vw;letter-spacing:-.02em;
    opacity:0;transform:translateY(1.5vw);
    animation:in .9s cubic-bezier(.22,.61,.36,1) 1s forwards}
  .mark i{width:1.45vw;height:1.45vw;border-radius:50%;background:#D8CFC0}
  @keyframes in{to{opacity:1;transform:none}}
</style>
</head>
<body>
  <h2>Tell me what you do.<br><em>I'll build the site.</em></h2>
  <div class="tiers">
    <div class="tier"><b>Basic</b><span>$50</span><i>3 days</i></div>
    <div class="tier"><b>Standard</b><span>$100</span><i>2 days</i></div>
    <div class="tier"><b>Premium</b><span>$200</span><i>1 day</i></div>
  </div>
  <div class="mark"><i></i> baraah-sites</div>
</body>
</html>
